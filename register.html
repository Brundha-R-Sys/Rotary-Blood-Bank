<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donor Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Register as a Donor</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>
  <main>
    <form id="registerForm">
      <input type="text" placeholder="Full Name" required id="name" />
      <input type="number" placeholder="Age" required id="age" />
      <input type="text" placeholder="Blood Group (e.g., A+)" required id="blood" />
      <input type="text" placeholder="Location" required id="location" />
      <input type="text" placeholder="Contact Number" required id="contact" />
      <button type="submit">Register</button>
    </form>
    <p id="message"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
